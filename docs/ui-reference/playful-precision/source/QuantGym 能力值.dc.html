<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#f4f4fb;--surface:#fff;--surface-2:#fbfbfd;--surface-3:#faf9ff;--border:#ecebf7;--border-2:#e8e7f4;--text:#1b1a38;--text-2:#4a4966;--muted:#6d6c8e;--muted-2:#9998b6;--muted-3:#a3a2bd;--track:#eeedfa;--brand:#5b5ff5;--brand-ink:#5b5ff5;--brand-soft:#eef0ff;--brand-soft-2:#f6f0ff;--done-soft:#f4fbf7;--shadow-card:0 1px 2px rgba(27,26,56,.05),0 14px 32px -24px rgba(74,67,214,.35)}
:root[data-theme="dark"]{--bg-base:#111020;--surface:#201f39;--surface-2:#1b1a30;--surface-3:#242243;--border:#332f57;--border-2:#3a3763;--text:#f1f0fb;--text-2:#cbc9e8;--muted:#a6a4cf;--muted-2:#8785ae;--muted-3:#76749c;--track:#2c2a4e;--brand:#7d7bff;--brand-ink:#b9b8ff;--brand-soft:#2a2856;--brand-soft-2:#2c2650;--done-soft:#17251f;--shadow-card:0 1px 2px rgba(0,0,0,.35),0 14px 32px -24px rgba(0,0,0,.6)}
body{background:var(--bg-base)}
</style>
<script src="./qg-state.js"></script>
<script>try{var t=localStorage.getItem("qg-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</helmet>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="24" fill="#5b5ff5"/><path d="M50 20l26 15v30L50 80 24 65V35z" fill="none" stroke="#fff" stroke-width="5"/><path d="M50 34l16 9v18l-16 9-16-9V43z" fill="#fff" opacity=".5"/></svg>
</template>
<div style="font-family:'Plus Jakarta Sans','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;gap:16px">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div>
      <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:20px;background:var(--brand-soft);color:#5b5ff5;font-size:11.5px;font-weight:700;margin-bottom:10px">GROWTH · 能力雷达</div>
      <h1 style="margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em">能力值 <span style="color:#5b5ff5">Skills</span></h1>
      <p style="margin:6px 0 0;font-size:13.5px;color:var(--muted);font-weight:500">六维能力画像 · 找到弱项，精准补强</p>
    </div>
    <div style="display:flex;gap:10px">
      <div style="padding:11px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(27,26,56,.04)"><div style="font-size:11px;color:var(--muted-2);font-weight:600">综合评级</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:20px">{{ tier }}</div></div>
      <div style="padding:11px 16px;border-radius:16px;background:linear-gradient(150deg,#eef0ff,#f6f0ff);border:1px solid #e0dffb"><div style="font-size:11px;color:#7a79b8;font-weight:600">本周提升</div><div style="font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#5b5ff5">+6%</div></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start">

    <div style="border-radius:22px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(27,26,56,.05),0 14px 32px -24px rgba(74,67,214,.35);padding:20px;display:flex;flex-direction:column;align-items:center">
      <svg viewBox="0 0 280 280" style="width:100%;max-width:340px;height:auto">
        <sc-for list="{{ rings }}" as="r" hint-placeholder-count="4"><polygon points="{{ r.pts }}" fill="none" stroke="var(--border)" stroke-width="1"></polygon></sc-for>
        <sc-for list="{{ axes }}" as="a" hint-placeholder-count="6"><line x1="140" y1="140" x2="{{ a.x }}" y2="{{ a.y }}" stroke="var(--border)" stroke-width="1"></line></sc-for>
        <polygon points="{{ targetPts }}" fill="none" stroke="#c9c7f5" stroke-width="1.5" stroke-dasharray="4 4"></polygon>
        <polygon points="{{ youPts }}" fill="rgba(91,95,245,.16)" stroke="#5b5ff5" stroke-width="2.5" stroke-linejoin="round"></polygon>
        <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="6"><circle cx="{{ n.x }}" cy="{{ n.y }}" r="4" fill="#5b5ff5" stroke="#fff" stroke-width="2"></circle></sc-for>
        <sc-for list="{{ labels }}" as="l" hint-placeholder-count="6"><text x="{{ l.x }}" y="{{ l.y }}" text-anchor="{{ l.anchor }}" font-family="Plus Jakarta Sans,sans-serif" font-size="12" font-weight="700" style="fill:var(--text-2)">{{ l.t }}</text></sc-for>
      </svg>
      <div style="display:flex;gap:18px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)"><span style="width:14px;height:8px;border-radius:3px;background:#5b5ff5"></span>你的能力</div>
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)"><span style="width:14px;height:0;border-top:2px dashed #c9c7f5"></span>目标段位</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ skills }}" as="s" hint-placeholder-count="6">
        <div style="border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(27,26,56,.04);padding:13px 15px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
            <span style="{{ s.iconWrap }}"><span style="width:17px;height:17px;display:inline-flex">{{ s.iconEl }}</span></span>
            <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">{{ s.name }}</div><div style="font-size:11px;color:var(--muted-3);font-weight:600">{{ s.sub }}</div></div>
            <span style="{{ s.trendStyle }}">{{ s.trend }}</span>
            <span style="font-family:'Space Grotesk';font-size:16px;font-weight:700;color:{{ s.valColor }};width:34px;text-align:right">{{ s.val }}</span>
            <button type="button" onClick="{{ s.onTrain }}" style="padding:6px 11px;border-radius:9px;border:1px solid var(--border);background:var(--brand-soft);color:var(--brand-ink);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;flex:0 0 auto;transition:transform .12s ease" style-hover="transform:translateY(-1px)">去练</button>
          </div>
          <div style="height:7px;border-radius:20px;background:var(--track);overflow:hidden"><div style="{{ s.barStyle }}"></div></div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px">
    <div style="border-radius:20px;background:linear-gradient(135deg,#1b1a38,#2d2a5c);color:#fff;padding:20px 22px;display:flex;align-items:center;gap:18px">
      <img src="assets/avatar-focused-v2.png" alt="" style="width:60px;height:60px;flex:0 0 auto">
      <div style="flex:1">
        <div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#b9b8e0;margin-bottom:4px">弱项建议 · COACH</div>
        <div style="font-size:15px;font-weight:800;line-height:1.45">「随机过程 / 统计」是你最弱的一环（58）。建议本周去<span style="color:#a9adff"> 题目 → 概率专题 </span>刷 10 题，并读完<span style="color:#a9adff"> 概率随机分析 10 题</span>。</div>
        <button type="button" onClick="{{ goWeak }}" style="margin-top:12px;padding:10px 16px;border:none;border-radius:12px;background:linear-gradient(180deg,#6d70f8,#5b5ff5);color:#fff;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 3px 0 #3f39c9,0 10px 20px -10px rgba(91,95,245,.7);transition:transform .12s ease" style-active="transform:translateY(2px)">去刷统计弱项 →</button>
      </div>
    </div>
    <div style="border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(27,26,56,.05);padding:18px 20px">
      <div style="font-size:13.5px;font-weight:800;margin-bottom:13px">近 4 周趋势</div>
      <div style="display:flex;align-items:flex-end;gap:10px;height:90px">
        <sc-for list="{{ trend }}" as="t" hint-placeholder-count="4">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
            <div style="flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center"><div style="{{ t.barStyle }}"></div></div>
            <span style="font-size:10.5px;color:var(--muted-3);font-weight:600">{{ t.label }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  icon(name){
    const R=React.createElement;
    const w=(ch)=>R('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.9,strokeLinecap:'round',strokeLinejoin:'round',style:{width:'100%',height:'100%',display:'block'}},ch);
    const P=(d)=>R('path',{d,key:d.slice(0,6)});
    const map={
      prob:[P('M4 18L18 4'),P('M7 7h.01'),P('M15 17h.01')],
      calc:[R('rect',{x:4,y:3,width:16,height:18,rx:3,key:'r'}),P('M8 7h8'),P('M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01')],
      stat:[P('M4 19V5'),P('M4 19h16'),P('M8 16v-4M12 16V8M16 16v-6')],
      deriv:[P('M4 16c4 0 4-8 8-8s4 8 8 8')],
      code:[P('M9 8l-4 4 4 4'),P('M15 8l4 4-4 4')],
      speed:[R('circle',{cx:12,cy:13,r:8,key:'c'}),P('M12 13V9'),P('M9 3h6')],
    };
    return w(map[name]||map.prob);
  }

  renderVals(){
    const skillDefs=[
      {name:'概率 / 期望',sub:'Probability',val:86,icon:'prob',color:'#5b5ff5',trend:'▲ 4',ctx:{topic:'probabilityExpectation'}},
      {name:'速算 Mental Math',sub:'Arithmetic',val:91,icon:'speed',color:'#16a06a',trend:'▲ 2',ctx:{topic:'mentalMath'}},
      {name:'微积分',sub:'Calculus',val:74,icon:'calc',color:'#ff9f2e',trend:'▲ 5',ctx:{topic:'calculus'}},
      {name:'统计 / 随机过程',sub:'Stochastic',val:58,icon:'stat',color:'#d0524b',trend:'▼ 1',ctx:{topic:'statistics'}},
      {name:'衍生品定价',sub:'Derivatives',val:69,icon:'deriv',color:'#8a63e8',trend:'▲ 3',ctx:{src:'Hull'}},
      {name:'编程',sub:'Coding',val:80,icon:'code',color:'#2f9be0',trend:'▲ 6',ctx:{topic:'coding'}},
    ];
    const target=[92,95,85,80,82,88];

    const cx=140, cy=140, R=100, N=6;
    const pt=(i,rad)=>{ const ang=(-90 + i*360/N)*Math.PI/180; return [cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad]; };
    const poly=(vals,scale)=>vals.map((v,i)=>{ const p=pt(i,R*(v/100)*scale); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');

    const rings=[0.25,0.5,0.75,1].map(f=>({ pts:[0,1,2,3,4,5].map(i=>{const p=pt(i,R*f);return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ') }));
    const axes=[0,1,2,3,4,5].map(i=>{ const p=pt(i,R); return { x:p[0].toFixed(1), y:p[1].toFixed(1) }; });
    const nodes=skillDefs.map((s,i)=>{ const p=pt(i,R*(s.val/100)); return { x:p[0].toFixed(1), y:p[1].toFixed(1) }; });
    const labels=skillDefs.map((s,i)=>{ const p=pt(i,R+22); let anchor='middle'; if(p[0]>cx+10)anchor='start'; else if(p[0]<cx-10)anchor='end'; return { x:p[0].toFixed(1), y:(p[1]+4).toFixed(1), t:s.name.split(' ')[0], anchor }; });

    const skills=skillDefs.map(s=>({
      name:s.name, sub:s.sub, val:s.val, trend:s.trend, valColor:s.color,
      onTrain:()=>{ if(window.QG) QG.navigate('problems', s.ctx); },
      iconEl:this.icon(s.icon),
      iconWrap:'display:grid;place-items:center;width:32px;height:32px;border-radius:10px;flex:0 0 auto;color:'+s.color+';background:'+s.color+'1a',
      trendStyle:'font-family:'+"'Space Grotesk'"+';font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;'+(s.trend[0]==='▲'?'color:#0f9d63;background:#e3f7ee':'color:#d0524b;background:#fdeceb'),
      barStyle:'height:100%;width:'+s.val+'%;border-radius:20px;background:linear-gradient(90deg,'+s.color+','+s.color+'aa)',
    }));

    const trend=[['3周前',62],['2周前',66],['上周',71],['本周',77]].map((t,i)=>({
      label:t[0], barStyle:'width:70%;border-radius:7px 7px 3px 3px;height:'+t[1]+'%;background:'+(i===3?'linear-gradient(180deg,#5b5ff5,#8a7bff)':'linear-gradient(180deg,#cfcef6,#e4e3fb)'),
    }));

    const tier = window.QG ? QG.level().tier : 'Analyst II';
    return { rings, axes, nodes, labels, youPts:poly(skillDefs.map(s=>s.val),1), targetPts:poly(target,1), skills, trend, tier,
      goWeak:()=>{ if(window.QG) QG.navigate('problems',{topic:'statistics'}); } };
  }
}
</script>
</body>
</html>
