[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgym-api"
version = "0.1.0"
description = "QuantGym Phase 1 preview API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "boto3==1.43.51",
  "botocore==1.43.51",
  "cryptography==49.0.0",
  "email-validator==2.3.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.13.0",
  "s3transfer==0.19.1",
  "SQLAlchemy==2.0.51",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "asgi-lifespan==2.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.14.2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
