<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quant Collector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <strong>Quant Collector</strong>
        <span id="sourceHost">...</span>
      </header>

      <section class="preview">
        <h1 id="problemTitle">读取中</h1>
        <div id="problemMeta"></div>
        <p id="problemPrompt"></p>
      </section>

      <label>
        Board URL
        <input id="boardUrl" type="url" spellcheck="false">
      </label>

      <div class="actions">
        <button id="recordBtn" type="button">记录题目</button>
        <button id="copyBtn" type="button">复制 JSON</button>
      </div>

      <section id="leetcodeSync" class="leetcode-sync" hidden>
        <button id="syncLeetcodeBtn" type="button">同步力扣记录</button>
        <p>从当前登录的力扣账号读取已通过题目和提交时间，前往 QuantGym 确认导入。同步时请保持弹窗打开。</p>
        <button id="downloadLeetcodeBtn" type="button" hidden>下载记录 JSON</button>
      </section>

      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
