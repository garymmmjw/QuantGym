<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="0.55" stop-color="#e8f1ec"/>
      <stop offset="1" stop-color="#dce8f4"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f8f6b"/>
      <stop offset="1" stop-color="#28537f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1f2b24" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="1240" cy="64" r="180" fill="#2f8f6b" opacity="0.10"/>
  <circle cx="112" cy="520" r="210" fill="#28537f" opacity="0.08"/>
  <g transform="translate(104 102)">
    <rect width="128" height="128" rx="30" fill="#fffdf8" filter="url(#shadow)"/>
    <text x="28" y="88" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="900" fill="#2f8f6b">Q</text>
  </g>
  <text x="104" y="286" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900" fill="#20211f">QuantGym Collector</text>
  <text x="108" y="344" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#4f5550">Capture problems into your QuantGym study board.</text>
  <rect x="108" y="390" width="214" height="48" rx="24" fill="#2f8f6b"/>
  <text x="142" y="422" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900" fill="#ffffff">One-click capture</text>
  <rect x="338" y="390" width="190" height="48" rx="24" fill="#fffdf8" stroke="#ded8cb"/>
  <text x="373" y="422" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900" fill="#20211f">No host access</text>
  <g transform="translate(804 96)" filter="url(#shadow)">
    <rect width="430" height="368" rx="24" fill="#fffdf8" stroke="#d8d0c2"/>
    <rect x="28" y="28" width="374" height="58" rx="16" fill="#f7f4ed"/>
    <text x="54" y="64" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" fill="#20211f">Quant Collector</text>
    <text x="296" y="64" font-family="Inter, Arial, sans-serif" font-size="14" fill="#626760">leetcode.com</text>
    <rect x="28" y="108" width="374" height="126" rx="16" fill="#fffdf8" stroke="#ded8cb"/>
    <text x="54" y="148" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#20211f">Median of Two Sorted Arrays</text>
    <rect x="54" y="170" width="60" height="25" rx="12" fill="#e2ebf7"/>
    <text x="70" y="187" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#28537f">Hard</text>
    <rect x="124" y="170" width="78" height="25" rx="12" fill="#e6f1e9"/>
    <text x="145" y="187" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2f6f54">Array</text>
    <text x="54" y="218" font-family="Inter, Arial, sans-serif" font-size="14" fill="#626760">Title, prompt, source, difficulty, and tags.</text>
    <text x="28" y="268" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="900" fill="#626760">BOARD URL</text>
    <rect x="28" y="282" width="374" height="42" rx="11" fill="#f7f4ed" stroke="#ded8cb"/>
    <text x="48" y="309" font-family="Inter, Arial, sans-serif" font-size="15" fill="#626760">https://beta.quantgym.app/</text>
  </g>
  <rect x="720" y="410" width="156" height="52" rx="26" fill="url(#brand)"/>
  <text x="758" y="444" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff">Collect</text>
