name: Frontend V2 Preview

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_linux_visual_baselines:
        description: Generate reviewable Playwright Linux visual baselines
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-v2-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  node-gates:
    name: Node and browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete review history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checkout is a complete trusted repository
        run: |
          trusted_git() {
            env -i \
              PATH=/usr/bin:/bin \
              LANG=C \
              LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_LITERAL_PATHSPECS=1 \
              /usr/bin/git \
              -c core.fsmonitor=false \
              -c core.untrackedCache=false \
              -c core.ignoreStat=false \
              "$@"
          }
          shallow="$(trusted_git rev-parse --is-shallow-repository)"
          git_dir="$(trusted_git rev-parse --absolute-git-dir)"
          git_common_dir="$(trusted_git rev-parse --git-common-dir)"
          shallow_path="$(trusted_git rev-parse --git-path shallow)"
          if test -e "$shallow_path"; then
            shallow_bytes="$(wc -c < "$shallow_path")"
          else
            shallow_bytes="absent"
          fi
          printf '%s\n' \
            "trusted_git_shallow_after_checkout=$shallow" \
            "trusted_git_dir_after_checkout=$git_dir" \
            "trusted_git_common_dir_after_checkout=$git_common_dir" \
            "trusted_git_shallow_path_after_checkout=$shallow_path" \
            "trusted_git_shallow_bytes_after_checkout=$shallow_bytes"
          test "$shallow" = "false"

      - name: Select the locked Node runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 20.20.2
          cache: npm
          package-manager-cache: false

      - name: Select the locked npm CLI
        run: |
          npm install --global npm@10.8.2
          test "$(node --version)" = "v20.20.2"
          test "$(npm --version)" = "10.8.2"

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install the lockfile Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Check TypeScript, JavaScript, and styles
        run: |
          npm run typecheck:v2
          npm run lint:v2
          npm run lint:styles:v2

      - name: Build and inspect the isolated V2 artifact
        run: |
          npm run build:v2
          npm run check:frontend-v2-boundaries

      - name: Run V2 and Phase 1 tests
        run: |
          trusted_git() {
            env -i \
              PATH=/usr/bin:/bin \
              LANG=C \
              LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_LITERAL_PATHSPECS=1 \
              /usr/bin/git \
              -c core.fsmonitor=false \
              -c core.untrackedCache=false \
              -c core.ignoreStat=false \
              "$@"
          }
          assert_trusted_history() {
            local label="$1"
            local shallow git_dir git_common_dir shallow_path shallow_bytes
            shallow="$(trusted_git rev-parse --is-shallow-repository)"
            git_dir="$(trusted_git rev-parse --absolute-git-dir)"
            git_common_dir="$(trusted_git rev-parse --git-common-dir)"
            shallow_path="$(trusted_git rev-parse --git-path shallow)"
            if test -e "$shallow_path"; then
              shallow_bytes="$(wc -c < "$shallow_path")"
            else
              shallow_bytes="absent"
            fi
            printf '%s\n' \
              "trusted_git_shallow_${label}=$shallow" \
              "trusted_git_dir_${label}=$git_dir" \
              "trusted_git_common_dir_${label}=$git_common_dir" \
              "trusted_git_shallow_path_${label}=$shallow_path" \
              "trusted_git_shallow_bytes_${label}=$shallow_bytes"
            test "$shallow" = "false"
          }
          assert_trusted_history after_build
          npm run test:v2
          assert_trusted_history after_v2_tests
          npm run test:frontend-upgrade:phase1:node
          assert_trusted_history after_phase1_tests

      - name: Generate Playwright Linux visual baselines
        if: ${{ inputs.update_linux_visual_baselines }}
        id: generate_linux_baselines
        shell: bash
        run: |
          find tests/e2e-v2 -type f -name '*-linux.png' -delete
          npm run test:e2e:v2 -- --grep '@visual:' --update-snapshots --retries=0 --timeout=90000

          mapfile -d '' snapshots < <(
            find tests/e2e-v2 -type f -name '*-linux.png' -print0 | sort -z
          )
          test "${#snapshots[@]}" = "21"

          artifact_dir="$RUNNER_TEMP/playwright-linux-visual-baselines"
          test ! -e "$artifact_dir"
          mkdir --mode=0755 "$artifact_dir"
          for snapshot in "${snapshots[@]}"; do
            sha256sum "$snapshot" >> "$artifact_dir/SHA256SUMS"
            install -D --mode=0644 "$snapshot" "$artifact_dir/$snapshot"
          done
          (
            cd "$artifact_dir"
            sha256sum --check --strict SHA256SUMS
          )
          printf 'snapshot_count=%s\n' "${#snapshots[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload generated Playwright Linux visual baselines
        if: >-
          ${{
            inputs.update_linux_visual_baselines
            && steps.generate_linux_baselines.outcome == 'success'
            && steps.generate_linux_baselines.outputs.snapshot_count == '21'
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-linux-visual-baselines-${{ github.run_id }}
          path: ${{ runner.temp }}/playwright-linux-visual-baselines
          if-no-files-found: error
          retention-days: 14

      - name: Run the complete 82-test Playwright suite
        if: ${{ !inputs.update_linux_visual_baselines }}
        run: npm run test:e2e:v2 -- --retries=0

      - name: Verify browser tests preserved the complete trusted repository
        if: ${{ !inputs.update_linux_visual_baselines }}
        run: |
          trusted_git() {
            env -i \
              PATH=/usr/bin:/bin \
              LANG=C \
              LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_LITERAL_PATHSPECS=1 \
              /usr/bin/git \
              -c core.fsmonitor=false \
              -c core.untrackedCache=false \
              -c core.ignoreStat=false \
              "$@"
          }
          shallow="$(trusted_git rev-parse --is-shallow-repository)"
          git_dir="$(trusted_git rev-parse --absolute-git-dir)"
          git_common_dir="$(trusted_git rev-parse --git-common-dir)"
          shallow_path="$(trusted_git rev-parse --git-path shallow)"
          if test -e "$shallow_path"; then
            shallow_bytes="$(wc -c < "$shallow_path")"
          else
            shallow_bytes="absent"
          fi
          printf '%s\n' \
            "trusted_git_shallow_after_browser_tests=$shallow" \
            "trusted_git_dir_after_browser_tests=$git_dir" \
            "trusted_git_common_dir_after_browser_tests=$git_common_dir" \
            "trusted_git_shallow_path_after_browser_tests=$shallow_path" \
            "trusted_git_shallow_bytes_after_browser_tests=$shallow_bytes"
          test "$shallow" = "false"

      - name: Verify frozen contracts and offline acceptance gates
        run: |
          npm run check:frontend-upgrade:phase1:contracts
          npm run check:frontend-upgrade:phase1:legacy
          npm run check:frontend-upgrade:phase1:auth -- --offline
          npm run check:frontend-upgrade:phase1:surfaces -- --offline
          npm run check:frontend-upgrade:phase1 -- --offline

      - name: Upload Playwright failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-failure-diagnostics-${{ github.run_id }}
          path: test-results/e2e-v2
          if-no-files-found: ignore
          retention-days: 14

  python-gates:
    name: Python API and migration gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete review history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the locked Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: api/requirements.lock.txt

      - name: Select the locked Node runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 20.20.2
          cache: npm
          package-manager-cache: false

      - name: Verify the locked runtimes
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 13, 14), sys.version'
          npm install --global npm@10.8.2
          test "$(node --version)" = "v20.20.2"
          test "$(npm --version)" = "10.8.2"

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes -r api/requirements.lock.txt

      - name: Run API and migration tests
        run: |
          python -m pytest api/tests
          python -m alembic -c api/alembic.ini heads
          python -B -m unittest discover -s tests -p 'test_frontend_upgrade_phase1_*.py' -v

      - name: Verify generated OpenAPI
        run: npm run check:openapi:v2
        env:
          QUANTGYM_PYTHON_313: python
